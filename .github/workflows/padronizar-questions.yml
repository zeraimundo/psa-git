name: Padronizar questions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/padronizar-questions.yml']
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar bancos de questões
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),root=process.cwd();const mark=v=>`/* QUIZ_SHUFFLE2:${v} */`;
          function walk(d){let a=[];for(const e of fs.readdirSync(d,{withFileTypes:true})){if(['.git','.github'].includes(e.name))continue;const p=path.join(d,e.name);if(e.isDirectory())a=a.concat(walk(p));else if(/\.(html?|js)$/i.test(e.name))a.push(p)}return a}
          function endArr(s,start){let d=0,q=null,esc=false;for(let i=start;i<s.length;i++){const c=s[i];if(q){if(esc){esc=false;continue}if(c==='\\'){esc=true;continue}if(c===q)q=null;continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='[')d++;else if(c===']'&&--d===0)return i}return -1}
          function code(v){return `\n${mark(v)}\n(()=>{const q=${v};if(!Array.isArray(q)||!q.length)return;const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const pos=sh(q.map((_,i)=>i%4));q.forEach((it,n)=>{let ar=null,idx=null,set=null;if(Array.isArray(it)&&Array.isArray(it[1])&&Number.isInteger(it[2])){ar=it[1];idx=it[2];set=v=>{it[1]=v.ar;it[2]=v.idx}}else if(it&&Array.isArray(it.o)&&Number.isInteger(it.a)){ar=it.o;idx=it.a;set=v=>{it.o=v.ar;it.a=v.idx}}else if(it&&Array.isArray(it.a)&&Number.isInteger(it.c)){ar=it.a;idx=it.c;set=v=>{it.a=v.ar;it.c=v.idx}}if(!ar||idx<0||idx>=ar.length||ar.length<2)return;const right=ar[idx],rest=ar.filter((_,i)=>i!==idx);sh(rest);const t=pos[n]%ar.length;rest.splice(t,0,right);set({ar:rest,idx:t})})})();\n`}
          let changed=[];for(const f of walk(root)){let s=fs.readFileSync(f,'utf8'),ed=[];const re=/\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*\[/g;let m;while((m=re.exec(s))){const v=m[1];if(!/(quiz|questions|perguntas)/i.test(v)||s.includes(mark(v)))continue;const st=s.indexOf('[',m.index),en=endArr(s,st);if(en<0)continue;let at=en+1;while(/\s/.test(s[at]||''))at++;if(s[at]===';')at++;ed.push({at,t:code(v)});re.lastIndex=en+1}for(const e of ed.sort((a,b)=>b.at-a.at))s=s.slice(0,e.at)+e.t+s.slice(e.at);if(ed.length){fs.writeFileSync(f,s);changed.push(path.relative(root,f))}}console.log(changed);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/padronizar-questions.yml
          git add -A
          git diff --cached --quiet || (git commit -m 'Embaralha alternativas dos bancos de questões' && git push)
